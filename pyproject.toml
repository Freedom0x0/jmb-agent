[project]
name = "jmb"
version = "0.1.0"
description = "一个记得住你、跟得上你、不多管的伙伴（本机陪伴 agent）"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "trafilatura>=2.3",
    "openai>=3.39",
    "context-forge",
]

[project.scripts]
jmb = "jmb.cli:main"

# 开发期直接跟 ../Context Forge（editable）；发布时换成固定版本的 wheel（D32）
[tool.uv.sources]
context-forge = { path = "../Context Forge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jmb"]
